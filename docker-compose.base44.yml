services:
  api:
    image: node:22
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
      - pact-data:/data
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATA_DIR: /data
      # On-chain policy program (devnet, public id — not a secret).
      # Wallets pay through the vault path; legacy direct-SPL is used when unset.
      PACT_POLICY_PROGRAM_ID: "6Ygcr4fxma8ddFEkRphk73UBz8Ykdx97GFxcKjNFu1WY"
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 240s
    restart: on-failure

  web:
    image: node:22
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 240s
    restart: on-failure

volumes:
  pact-data:
